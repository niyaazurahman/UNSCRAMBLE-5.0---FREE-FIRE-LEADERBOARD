<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNSCRAMBLE 5.0 - Free Fire Live Leaderboard</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Rajdhani:wght@500;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#f5b700;--gold2:#ffdf6b;--bg:#0a0a0a;--card:#141414;--line:#2a2210;--txt:#f3efe2;--mute:#8d8566;--green:#27d36b}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(circle at 50% -10%,#2b2208 0,#0a0a0a 55%);color:var(--txt);font-family:Rajdhani,system-ui,sans-serif;min-height:100vh;padding:14px 18px}
header{text-align:center;padding:6px 0 10px}
h1{font-family:Orbitron,sans-serif;font-weight:900;font-size:clamp(20px,3.2vw,40px);letter-spacing:3px;color:var(--gold);text-shadow:0 0 18px #f5b70066}
.sub{color:var(--mute);letter-spacing:2px;font-size:clamp(11px,1.3vw,16px)}
nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0 14px}
nav button{background:#000;color:var(--gold);border:1px solid var(--gold);padding:7px 16px;font:700 15px Rajdhani;letter-spacing:1px;cursor:pointer;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
nav button.on{background:var(--gold);color:#000}
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.4fr) minmax(0,1fr);gap:14px;max-width:1500px;margin:auto;align-items:stretch}
.char{position:relative;border:1px solid var(--line);background:linear-gradient(180deg,#1b1505,#0d0d0d);overflow:hidden;min-height:540px}
.char::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,#f5b70050 0,transparent 60%),repeating-linear-gradient(60deg,#f5b70010 0 2px,transparent 2px 26px);z-index:0}
.char::after{content:"";position:absolute;left:0;right:0;height:60px;background:linear-gradient(180deg,transparent,#f5b70025,transparent);animation:scan 4s linear infinite;z-index:3;pointer-events:none}
.char svg.op{position:absolute;inset:0;width:100%;height:100%;z-index:1;filter:drop-shadow(0 0 14px #f5b70077);animation:fl 4s ease-in-out infinite}
.char.b svg.op{animation-delay:-2s}
.char canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1}.char:not(.flat) img{display:none}.char.flat svg.op{display:none}.char.flat img{display:block;object-fit:contain}.char img{z-index:2}.char span{z-index:4}
@keyframes fl{50%{transform:translateY(-8px)}}
@keyframes scan{from{top:-60px}to{top:100%}}
.char img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 0 22px #f5b70055)}
.char span{position:absolute;bottom:8px;left:0;right:0;text-align:center;font:900 13px Orbitron;color:var(--gold);letter-spacing:3px;text-shadow:0 0 8px #000}
.board{background:var(--card);border:1px solid var(--gold);box-shadow:0 0 30px #f5b70022}
.board h2{font-family:Orbitron;font-size:clamp(14px,1.8vw,22px);color:#000;background:linear-gradient(90deg,var(--gold),var(--gold2));padding:9px 14px;letter-spacing:2px;display:flex;justify-content:space-between;gap:8px}
table{width:100%;border-collapse:collapse;font-size:clamp(13px,1.6vw,22px)}
th{color:var(--mute);font-weight:600;text-align:center;padding:7px 6px;letter-spacing:1px;border-bottom:1px solid var(--line);font-size:.8em}
td{padding:9px 6px;text-align:center;border-bottom:1px solid #1d1d1d;font-weight:600}
td.t{text-align:left;font-weight:700;letter-spacing:.5px}
td.tot{color:var(--gold2);font-weight:700;font-size:1.15em}
tr.r1 td:first-child,tr.r2 td:first-child,tr.r3 td:first-child{font-family:Orbitron;font-weight:900}
tr.r1{background:linear-gradient(90deg,#f5b70033,transparent)}tr.r1 td:first-child{color:var(--gold)}
tr.r2{background:linear-gradient(90deg,#c0c0c022,transparent)}tr.r2 td:first-child{color:#d8d8d8}
tr.r3{background:linear-gradient(90deg,#cd7f3222,transparent)}tr.r3 td:first-child{color:#e0954a}
tr.q td.t{border-left:4px solid var(--green)}
.chip{font-size:.7em;padding:2px 8px;border:1px solid var(--green);color:var(--green);letter-spacing:1px}
.chip.w{border-color:var(--gold);color:var(--gold)}
.bk{display:grid;gap:8px;padding:12px}
.m{display:grid;grid-template-columns:70px 1fr 60px 1fr;align-items:center;gap:8px;background:#0f0f0f;border:1px solid var(--line);padding:8px 10px;font-weight:700}
.m small{color:var(--mute);font-weight:600}
.m .w{color:var(--gold2)}
.champ{text-align:center;font:900 clamp(18px,2.5vw,32px) Orbitron;color:var(--gold);padding:14px;text-shadow:0 0 18px #f5b70088}
.foot{text-align:center;color:var(--mute);font-size:13px;margin-top:10px;letter-spacing:1px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);margin-right:6px;animation:p 1.4s infinite}
.dot.off{background:#d33;animation:none}
@keyframes p{50%{opacity:.25}}
@media(max-width:900px){.stage{grid-template-columns:1fr}.char{display:none}}

/* ===== Pro-series style leaderboard ===== */
body{background:linear-gradient(135deg,#050f18 0,#0a2a40 50%,#06141f 100%) fixed;font-family:'Barlow Condensed',Rajdhani,sans-serif}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(135deg,transparent 30%,rgba(58,166,226,.10) 30% 48%,transparent 48% 60%,rgba(58,166,226,.06) 60% 72%,transparent 72%)}
header,nav,.stage,.foot{position:relative}
nav button{color:#3aa6e2;border-color:#3aa6e2;font-family:'Barlow Condensed';font-weight:700}
nav button.on{background:#3aa6e2;color:#06141f}
.stage{grid-template-columns:minmax(0,.8fr) minmax(0,3.2fr) minmax(0,.8fr)}
.board{background:rgba(5,18,30,.92);border:1px solid #1d5f8c;box-shadow:0 0 40px #3aa6e222;padding:14px 16px 16px}
.hd{text-align:center;margin-bottom:10px}
.hd b{display:block;font-weight:800;font-size:clamp(26px,4vw,54px);letter-spacing:2px;color:#fff;line-height:1}
.hd i{display:block;font-style:normal;font-weight:700;font-size:clamp(12px,1.6vw,20px);letter-spacing:2px;color:#f5b700;margin-top:3px}
table.lb{width:100%;border-collapse:collapse;table-layout:fixed;font-size:clamp(15px,2vw,28px)}
.lb th{background:none;color:#d6e8f5;font-weight:700;font-size:.55em;letter-spacing:2px;padding:4px 4px 6px;text-align:center;border:0}
.lb td{padding:0 6px;height:clamp(32px,4.6vh,50px);border-bottom:2px solid #07131d;text-align:center;font-weight:800;color:#fff}
.lb .cn{width:7%}.lb .cm{width:8%}.lb .cb{width:15%}.lb .ck{width:15%}.lb .ct{width:17%}
.lb td.n,.lb td.tp{color:#0a1f3a;font-size:1.08em}
.lb tbody tr:nth-child(odd) td.n,.lb tbody tr:nth-child(odd) td.tp{background:#3aa6e2}
.lb tbody tr:nth-child(even) td.n,.lb tbody tr:nth-child(even) td.tp{background:#4271b8}
.lb tbody tr:nth-child(odd) td.tm,.lb tbody tr:nth-child(odd) td.mv,.lb tbody tr:nth-child(odd) td.bo{background:#0c2740}
.lb tbody tr:nth-child(even) td.tm,.lb tbody tr:nth-child(even) td.mv,.lb tbody tr:nth-child(even) td.bo{background:#112f4b}
.lb td.k{color:#0a1f3a;border-left:2px solid #f5b700}
.lb tbody tr:nth-child(odd) td.k{background:#ececec}
.lb tbody tr:nth-child(even) td.k{background:#c6c8cb}
.lb td.bo{border-left:2px solid #2d9ad6}
.lb td.tm{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.5px;text-transform:uppercase}
.lb td.tm .nm{vertical-align:middle}
.lg{display:inline-block;box-sizing:border-box;width:2.3em;height:2.3em;line-height:calc(2.3em - 4px);border-radius:50%;text-align:center;font-size:.46em;font-weight:800;letter-spacing:0;margin-right:1.4em;vertical-align:middle;border:2px solid rgba(255,255,255,.55);color:#fff;overflow:hidden}
.lb .chip{font-style:normal;font-size:.5em;margin-left:.8em;padding:1px 7px;border:1px solid #27d36b;color:#27d36b;letter-spacing:1px;vertical-align:middle}
.lb .chip.w{border-color:#f5b700;color:#f5b700}
.lb tr.q td.n{box-shadow:inset 5px 0 0 #27d36b}
.mv{font-style:normal;font-size:.7em}
.mv i,i.mv{font-style:normal}
i.mv.u{color:#27d36b}i.mv.d{color:#e5483c}i.mv.e{color:#7f93a3}
.lb td.wait{background:#0c2740;color:#7f93a3;padding:28px;font-weight:600}
.m{background:#0c2740;border-color:#1d5f8c}
.m .w{color:#5ec2ff}
.m span[style]{color:#3aa6e2}
.lb.t16{font-size:clamp(13px,1.7vw,21px)}.lb.t16 td{height:clamp(22px,3.3vh,36px)}
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
</head>
<body>
<header>
<h1>UNSCRAMBLE 5.0 &bull; FREE FIRE</h1>
<div class="sub">LIVE LEADERBOARD &nbsp;|&nbsp; YENEPOYA INSTITUTE OF TECHNOLOGY &nbsp;|&nbsp; 28TH OCTOBER</div>
</header>
<nav id="nav"></nav>
<div class="stage">
 <div class="char"><svg class="op" viewBox="0 0 200 400"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffdf6b"/><stop offset="1" stop-color="#8a5f00"/></linearGradient><linearGradient id="ak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e2e2e"/><stop offset="1" stop-color="#0b0b0b"/></linearGradient></defs><g stroke="#f5b700" stroke-width="1.5"><path d="M30 400L42 255Q58 208 100 202Q142 208 158 255L170 400Z" fill="url(#ak)"/><rect x="88" y="176" width="24" height="30" fill="#161616"/><rect x="68" y="222" width="64" height="72" rx="6" fill="#1b1505"/><rect x="74" y="270" width="16" height="18" rx="2" fill="#0d0d0d"/><rect x="96" y="270" width="16" height="18" rx="2" fill="#0d0d0d"/><rect x="118" y="270" width="10" height="18" rx="2" fill="#0d0d0d"/><ellipse cx="46" cy="238" rx="20" ry="14" fill="url(#ag)"/><ellipse cx="154" cy="238" rx="20" ry="14" fill="url(#ag)"/><ellipse cx="100" cy="142" rx="30" ry="36" fill="#222"/><path d="M72 150Q100 186 128 150L128 166Q100 198 72 166Z" fill="#0d0d0d"/><rect x="72" y="122" width="56" height="20" rx="9" fill="url(#ag)"/><path d="M65 132Q66 80 100 76Q134 80 135 132L128 118Q100 104 72 118Z" fill="url(#ak)"/></g><path d="M80 128H120" stroke="#fff" stroke-opacity=".6" stroke-width="2"/><g transform="rotate(-24 100 310)" stroke="#f5b700" stroke-width="1.5" fill="#111"><rect x="25" y="300" width="155" height="14" rx="4"/><rect x="118" y="289" width="32" height="12"/><rect x="42" y="314" width="12" height="28"/><rect x="170" y="303" width="22" height="5"/></g></svg><img alt=""><span>VANGUARD</span></div>
 <div class="board" id="board"></div>
 <div class="char b"><svg class="op" viewBox="0 0 200 400"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffdf6b"/><stop offset="1" stop-color="#8a5f00"/></linearGradient><linearGradient id="bk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e2e2e"/><stop offset="1" stop-color="#0b0b0b"/></linearGradient></defs><g stroke="#f5b700" stroke-width="1.5"><rect x="22" y="236" width="40" height="110" rx="12" fill="#101010"/><path d="M32 400L44 258Q60 212 100 206Q140 212 156 258L168 400Z" fill="url(#bk)"/><path d="M62 232L138 330M138 232L62 330" fill="none" stroke-width="5"/><circle cx="100" cy="281" r="9" fill="url(#bg)"/><path d="M60 152Q56 78 100 72Q144 78 140 152Q122 118 100 118Q78 118 60 152Z" fill="#171717"/><ellipse cx="100" cy="150" rx="24" ry="28" fill="#2a2a2a"/><path d="M76 150Q100 190 124 150L124 162Q100 196 76 162Z" fill="url(#bg)"/><path d="M64 142Q62 98 100 96Q138 98 136 142" fill="none" stroke-width="4"/><circle cx="64" cy="148" r="10" fill="url(#bg)"/><circle cx="136" cy="148" r="10" fill="url(#bg)"/><path d="M136 154L118 176" fill="none" stroke-width="3"/><circle cx="117" cy="177" r="4" fill="#f5b700"/></g><rect x="80" y="138" width="14" height="4" fill="#ffdf6b"/><rect x="106" y="138" width="14" height="4" fill="#ffdf6b"/><g transform="rotate(-12 100 330)" stroke="#f5b700" stroke-width="1.5" fill="#111"><rect x="70" y="318" width="100" height="16" rx="4"/><rect x="92" y="334" width="14" height="30" rx="3"/><rect x="150" y="310" width="30" height="8"/></g></svg><img alt=""><span>SHADOW</span></div>
</div>
<div class="foot"><span class="dot" id="dot"></span><span id="upd">Connecting...</span> &nbsp;|&nbsp; <a href="#" id="auto" style="color:var(--gold)">Auto-rotate: ON</a> &nbsp;|&nbsp; <a href="#" id="chg" style="color:var(--gold)">Change sheet</a></div>

<script>
/* ===== SETTINGS ===== */
const SHEET_ID=new URLSearchParams(location.search).get('sheet')||'1selH5r7V7QnlyBXueVEMroWO2bYGdqKAAHnT4MQnDXo'; // Updated Google Sheet; sheet must be shared: Anyone with link = Viewer
const REFRESH_MS=15000;   // data refresh
const ROTATE_MS=20000;    // view rotation
const POOLS=['Pool A','Pool B','Pool C','Pool D'];
/* ==================== */
const VIEWS=[...POOLS,'Top 16','Knockout'];
let cur=0,auto=true,cache={},timer;

function csv(t){const o=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];
 if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
 else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}else if(ch=='\n'){r.push(c);o.push(r);r=[];c=''}else if(ch!='\r')c+=ch}
 if(c||r.length){r.push(c);o.push(r)}return o}
async function sheet(n){const u=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(n)}&_=${Date.now()}`;
 const r=await fetch(u);if(!r.ok)throw 0;return csv(await r.text())}
const esc=s=>String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const isN=v=>/^\d+(\.0+)?$/.test((v||'').trim());
const num=v=>v===''||v==null?0:v;

const mvs={};
const hue=t=>{let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))%360;return h};
const ini=t=>{const w=t.trim().split(/\s+/);return(w.length>1?w[0][0]+w[1][0]:t.trim().slice(0,2)).toUpperCase()};
const badge=t=>t==='TBD'?'':`<span class="lg" style="background:hsl(${hue(t)} 65% 40%)">${esc(ini(t))}</span>`;
function arrows(n,d){
 const rank=r=>+(r.length>20?r[19]:r[0]);
 const key=d.map(r=>r[1]+':'+rank(r)).join('|'),map={};d.forEach(r=>map[r[1]]=rank(r));
 let st=mvs[n];if(!st)st=mvs[n]={key,map:{},base:{}};
 if(st.key!==key){st.base=st.map;st.key=key}
 st.map=map;
 return t=>{const o=st.base[t],c=map[t];
  if(o==null||o===c)return'<i class="mv e">&ndash;</i>';
  return c<o?'<i class="mv u">&#9650;</i>':'<i class="mv d">&#9660;</i>'}}

function poolHTML(n,rows){
 const d=rows.filter(r=>isN(r[0])).slice(-12).filter(r=>r[1]&&r[1].trim());
 // Points Manager columns: O=total score, P=Booyah, Q=kills, T=pool rank, U=status.
 d.sort((a,b)=>(+a[19]||999)-(+b[19]||999));
 const ar=arrows(n,d);
 let b=d.map(r=>{const st=(r[20]||'').toUpperCase(),t=r[1].trim(),w=st.includes('WILD');
  return `<tr class="${st?'q':''}"><td class="n">${esc(r[19]||r[0])}</td><td class="tm">${badge(t)}<span class="nm">${esc(t)}</span>${st?`<em class="chip ${w?'w':''}">${w?'WC':'Q'}</em>`:''}</td><td class="mv">${ar(t)}</td><td class="bo">${num(r[15])}</td><td class="k">${num(r[16])}</td><td class="tp">${num(r[14])}</td></tr>`}).join('');
 if(!b)b='<tr><td colspan="6" class="wait">Waiting for teams / match results...</td></tr>';
 return `<div class="hd"><b>LEADERBOARD</b><i>${n.toUpperCase()} &mdash; BATTLE ROYALE &bull; LIVE</i></div><table class="lb"><colgroup><col class="cn"><col><col class="cm"><col class="cb"><col class="ck"><col class="ct"></colgroup><thead><tr><th>#</th><th colspan="2">TEAM</th><th>BOOYAH</th><th>KILLS</th><th>TOTAL PTS</th></tr></thead><tbody>${b}</tbody></table>`}

function seedHTML(rows){
 const d=rows.filter(r=>isN(r[0])).slice(-16);
 const b=d.map(r=>{const t=(r[1]||'').trim();
  return `<tr><td class="n">${esc(r[0])}</td><td class="tm" colspan="2">${t?badge(t):''}<span class="nm">${esc(t)}</span></td><td class="bo">${esc(r[2])}</td><td class="k">${esc(r[3])}</td><td class="tp">${esc(r[4])}</td></tr>`}).join('');
 return `<div class="hd"><b>TOP 16 SEEDING</b><i>CLASH SQUAD QUALIFIERS</i></div><table class="lb t16"><colgroup><col class="cn"><col><col class="cm"><col class="cb"><col class="ck"><col class="ct"></colgroup><thead><tr><th>SEED</th><th colspan="2">TEAM</th><th>POOL</th><th>POOL RANK</th><th>SCORE</th></tr></thead><tbody>${b}</tbody></table>`}

function koHTML(rows){
 const m=rows.filter(r=>/^M\d+$/.test(r[0]));
 const ch=rows.find(r=>r[0]=='CHAMPION');
 const b=m.map(r=>{const a=+r[4],c=+r[5],w=r[6];
  return `<div class="m"><small>${esc(r[0])} <br>${esc((r[1]||'').split('(')[0])}</small><span class="${w&&w==r[2]?'w':''}">${esc(r[2])}</span><span style="text-align:center">${r[4]!==''||r[5]!==''?(a||0)+' - '+(c||0):'VS'}</span><span class="${w&&w==r[3]?'w':''}" style="text-align:right;color:inherit">${esc(r[3])}</span></div>`}).join('');
 const champ=ch&&ch[1]&&ch[1].trim()!='-'?`<div class="champ">&#127942; CHAMPION: ${esc(ch[1])}</div>`:'';
 return `<div class="hd"><b>KNOCKOUT</b><i>CLASH SQUAD &bull; BEST OF 7</i></div>${champ}<div class="bk">${b}</div>`}

function draw(){
 document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('on',i==cur));
 const v=VIEWS[cur],rows=cache[v];
 document.getElementById('board').innerHTML=!rows?'<h2><span>LOADING...</span></h2>':
  v=='Top 16'?seedHTML(rows):v=='Knockout'?koHTML(rows):poolHTML(v,rows)}

async function refresh(){
 try{
  const names={'Top 16':'Seeding','Knockout':'Knockout'};
  await Promise.all(VIEWS.map(async v=>{cache[v]=await sheet(names[v]||v)}));
  document.getElementById('dot').className='dot';
  document.getElementById('upd').textContent='Updated '+new Date().toLocaleTimeString();
 }catch(e){document.getElementById('dot').className='dot off';document.getElementById('upd').textContent='Cannot read sheet - share it as Anyone with link (Viewer) or click Change sheet'}
 draw()}

document.getElementById('nav').innerHTML=VIEWS.map((v,i)=>`<button data-i="${i}">${v.toUpperCase()}</button>`).join('');
document.getElementById('nav').onclick=e=>{const i=e.target.dataset.i;if(i!=null){cur=+i;auto=false;sync();draw()}};
document.getElementById('auto').onclick=e=>{e.preventDefault();auto=!auto;sync()};
document.getElementById('chg').onclick=e=>{e.preventDefault();const v=prompt('Paste your Google Sheet link (or just its ID):');if(!v)return;const m=v.match(/\/d\/([\w-]{20,})/),id=m?m[1]:v.trim();if(!/^[\w-]{20,}$/.test(id)){alert('That does not look like a Google Sheet link.');return}try{localStorage.setItem('ffsheet',id)}catch(x){}location.href=location.pathname+'?sheet='+id};
function sync(){document.getElementById('auto').textContent='Auto-rotate: '+(auto?'ON':'OFF')}
setInterval(()=>{if(auto){cur=(cur+1)%VIEWS.length;draw()}},ROTATE_MS);
setInterval(refresh,REFRESH_MS);
draw();refresh();
</script>

const els=[...document.querySelectorAll('.char')];
const flat=()=>els.forEach((el,i)=>{el.classList.add('flat');const im=el.querySelector('img');if(im)im.src=CH[(i*2)%CH.length].src});
if(!window.THREE){flat();return}
const T=THREE,panels=[];
const tex2=fn=>{const c=document.createElement('canvas');c.width=c.height=128;fn(c.getContext('2d'));return new T.CanvasTexture(c)};
const rad=(a,b)=>x=>{const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,a);g.addColorStop(1,b);x.fillStyle=g;x.fillRect(0,0,128,128)};
const fadeTex=tex2(x=>{const g=x.createLinearGradient(0,0,0,128);g.addColorStop(0,'#000');g.addColorStop(1,'#666');x.fillStyle=g;x.fillRect(0,0,128,128)});
const blobTex=tex2(rad('rgba(0,0,0,.8)','rgba(0,0,0,0)'));
const sparkTex=tex2(rad('rgba(255,225,130,1)','rgba(255,180,0,0)'));
const H=4.0,CYC=13000,FADE=900;
els.forEach((el,idx)=>{
 try{
  const cv=document.createElement('canvas');el.insertBefore(cv,el.firstChild);
  const r=new T.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
  r.setPixelRatio(Math.min(devicePixelRatio||1,2));r.outputEncoding=T.sRGBEncoding;
  const sc=new T.Scene(),cam=new T.PerspectiveCamera(30,1,.1,50);
  cam.position.set(0,2.2,10.4);cam.lookAt(0,2.0,0);
  sc.add(new T.HemisphereLight(0xffeec0,0x222222,.7));
  const key=new T.DirectionalLight(0xfff1d0,.8);key.position.set(2,5,6);sc.add(key);
  const rim=new T.PointLight(0xffb800,3,16);rim.position.set(-3.5,3,-2);sc.add(rim);
  const rim2=new T.PointLight(0xff7a00,2,16);rim2.position.set(3.5,1.2,-2.5);sc.add(rim2);
  const disc=new T.Mesh(new T.CylinderGeometry(1.5,1.62,.09,48),new T.MeshStandardMaterial({color:0x0d0d0d,metalness:.85,roughness:.3}));disc.position.y=-.045;sc.add(disc);
  const ringM=new T.MeshStandardMaterial({color:0xffb000,emissive:0xffb000,emissiveIntensity:1.3,roughness:.4});
  const ring=new T.Mesh(new T.TorusGeometry(1.56,.03,8,80),ringM);ring.rotation.x=Math.PI/2;ring.position.y=.03;sc.add(ring);
  const ld=new T.TextureLoader(),an=r.capabilities.getMaxAnisotropy();
  const items=CH.map(c=>{
   const tx=ld.load(c.src);tx.encoding=T.sRGBEncoding;tx.anisotropy=an;
   const w=H*c.w/c.h,g=new T.Group();g.visible=false;
   const m=new T.MeshStandardMaterial({map:tx,emissive:0xffffff,emissiveMap:tx,emissiveIntensity:.7,roughness:1,metalness:0,transparent:true,alphaTest:.02,side:T.DoubleSide,opacity:0});
   const p=new T.Mesh(new T.PlaneGeometry(w,H),m);p.position.y=H/2;g.add(p);
   const rm=new T.MeshBasicMaterial({map:tx,alphaMap:fadeTex,transparent:true,opacity:0,depthWrite:false,side:T.DoubleSide});
   const rf=new T.Mesh(new T.PlaneGeometry(w,H),rm);rf.scale.y=-1;rf.position.y=-H/2;g.add(rf);
   const bl=new T.Mesh(new T.PlaneGeometry(2.6,1),new T.MeshBasicMaterial({map:blobTex,transparent:true,depthWrite:false}));bl.rotation.x=-Math.PI/2;bl.position.y=.015;g.add(bl);
   sc.add(g);return{g,m,rm}
  });
  const N=40,pos=new Float32Array(N*3),spd=[];
  for(let i=0;i<N;i++){const a=Math.random()*6.283,d=.6+Math.random()*1.1;pos.set([Math.cos(a)*d,Math.random()*4,Math.sin(a)*d*.6],i*3);spd.push(.004+Math.random()*.008)}
  const pg=new T.BufferGeometry();pg.setAttribute('position',new T.BufferAttribute(pos,3));
  sc.add(new T.Points(pg,new T.PointsMaterial({map:sparkTex,size:.16,transparent:true,depthWrite:false,blending:T.AdditiveBlending,color:0xffc933})));
  const label=el.querySelector('span'),svg=el.querySelector('svg.op');if(svg)svg.style.display='none';
  const fit=()=>{const w=el.clientWidth,h=el.clientHeight;if(!w||!h)return;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()};
  fit();addEventListener('resize',fit);if(window.ResizeObserver)new ResizeObserver(fit).observe(el);
  const P={k:-1};
  P.step=t=>{
   const tt=t+idx*6500,ph=tt%CYC,k=(Math.floor(tt/CYC)+idx*2)%items.length;
   if(k!==P.k){P.k=k;items.forEach((it,i)=>it.g.visible=i===k);if(label)label.textContent=CH[k].n}
   const f=Math.max(0,Math.min(1,ph/FADE,(CYC-ph)/FADE)),e=f*f*(3-2*f),it=items[k];
   it.m.opacity=e;it.rm.opacity=.4*e;
   it.g.position.x=ph<FADE?-(1-e)*.5:(CYC-ph<FADE?(1-e)*.5:0);
   it.g.rotation.y=Math.sin(t*.00045+idx*1.7)*.3;
   it.g.scale.y=1+Math.sin(t/900)*.004;
   for(let i=0;i<N;i++){pos[i*3+1]+=spd[i];if(pos[i*3+1]>4.2)pos[i*3+1]=0}
   pg.attributes.position.needsUpdate=true;
   ringM.emissiveIntensity=1.1+.5*Math.sin(t/600);ring.rotation.z=t*.0003;
   r.render(sc,cam);
  };
  panels.push(P);
 }catch(e){console.warn('3D unavailable',e);el.classList.add('flat');const im=el.querySelector('img');if(im)im.src=CH[(idx*2)%CH.length].src}
});
if(panels.length){const loop=t=>{requestAnimationFrame(loop);panels.forEach(p=>p.step(t))};requestAnimationFrame(loop)}
})();
